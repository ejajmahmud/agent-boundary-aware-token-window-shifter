[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-boundary-aware-token-window-shifter"
version = "0.1.0"
description = "Syntactic and paragraph-aligned sliding window manager preventing sentence truncation during dynamic context compaction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-boundary-aware-token-window-shifter = "agent_boundary_aware_token_window_shifter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_boundary_aware_token_window_shifter*"]
